name: Sync CLI Mirrors to COS

# Mirrors bun/uv install scripts to POUNDING COS CDN (Guangzhou).
# The COS URLs serve as the first download source in managedCliInstallerBridge,
# falling back to official sources (bun.sh / astral.sh) if unreachable.
#
# Schedule: daily at 08:00 UTC (16:00 Beijing) + manual trigger via workflow_dispatch.

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Validate COS configuration
        env:
          COS_BUCKET: ${{ secrets.TENCENT_COS_BUCKET }}
          COS_REGION: ${{ secrets.TENCENT_COS_REGION }}
          COS_SECRET_ID: ${{ secrets.TENCENT_COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.TENCENT_COS_SECRET_KEY }}
        run: |
          test -n "$COS_BUCKET" || { echo "::error::Missing secret TENCENT_COS_BUCKET"; exit 1; }
          test -n "$COS_REGION" || { echo "::error::Missing secret TENCENT_COS_REGION"; exit 1; }
          test -n "$COS_SECRET_ID" || { echo "::error::Missing secret TENCENT_COS_SECRET_ID"; exit 1; }
          test -n "$COS_SECRET_KEY" || { echo "::error::Missing secret TENCENT_COS_SECRET_KEY"; exit 1; }

      - name: Install COSCLI
        run: |
          curl -L --fail --retry 3 --retry-delay 2 \
            -o coscli \
            https://cosbrowser.cloud.tencent.com/software/coscli/coscli-linux-amd64
          echo '7165f2ae16c5f7ac495864c963ca574a76e04ec72680d7bc8a8eee3234d8cf91  coscli' | sha256sum -c -
          chmod 755 coscli
          ./coscli --version

      - name: Sync bun install scripts
        env:
          COS_BUCKET: ${{ secrets.TENCENT_COS_BUCKET }}
          COS_REGION: ${{ secrets.TENCENT_COS_REGION }}
          COS_SECRET_ID: ${{ secrets.TENCENT_COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.TENCENT_COS_SECRET_KEY }}
        run: |
          set -euo pipefail

          coscli_cmd() {
            ./coscli "$@" \
              -e "cos.${COS_REGION}.myqcloud.com" \
              -i "$COS_SECRET_ID" \
              -k "$COS_SECRET_KEY" \
              --init-skip=true \
              --disable-log=true
          }

          mkdir -p cli-mirrors/bun cli-mirrors/uv

          # Download latest bun install scripts
          echo "Downloading bun install scripts..."
          curl -fsSL --retry 3 --retry-delay 2 -o cli-mirrors/bun/install.sh   https://bun.sh/install
          curl -fsSL --retry 3 --retry-delay 2 -o cli-mirrors/bun/install.ps1  https://bun.sh/install.ps1

          # Download latest uv install scripts
          echo "Downloading uv install scripts..."
          curl -fsSL --retry 3 --retry-delay 2 -o cli-mirrors/uv/install.sh   https://astral.sh/uv/install.sh
          curl -fsSL --retry 3 --retry-delay 2 -o cli-mirrors/uv/install.ps1  https://astral.sh/uv/install.ps1

          # Verify files are non-empty
          for f in cli-mirrors/bun/install.sh cli-mirrors/bun/install.ps1 cli-mirrors/uv/install.sh cli-mirrors/uv/install.ps1; do
            if [ ! -s "$f" ]; then
              echo "::error::$f is empty or missing"
              exit 1
            fi
            echo "  ✓ $f ($(wc -c < "$f") bytes)"
          done

          # Upload to COS
          COS_PATH="cos://${COS_BUCKET}/pounding/cli/"
          echo "Uploading to ${COS_PATH}..."
          coscli_cmd cp cli-mirrors/ "$COS_PATH" -r --include "*.sh" --include "*.ps1"

          echo "✓ Sync complete"

      - name: Summary
        run: |
          echo "### ✅ CLI mirrors synced to COS" >> "$GITHUB_STEP_SUMMARY"
          echo "| File | Size |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|------|" >> "$GITHUB_STEP_SUMMARY"
          for f in cli-mirrors/bun/install.sh cli-mirrors/bun/install.ps1 cli-mirrors/uv/install.sh cli-mirrors/uv/install.ps1; do
            echo "| $f | $(wc -c < "$f") bytes |" >> "$GITHUB_STEP_SUMMARY"
          done
