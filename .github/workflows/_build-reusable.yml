name: Build Pipeline (Reusable)

on:
  workflow_call:
    inputs:
      matrix:
        description: 'Build matrix as JSON string (passed via fromJSON in caller)'
        type: string
        required: true
      ref:
        description: 'Git ref to checkout (leave empty to use the triggering commit)'
        type: string
        default: ''
      skip_code_quality:
        description: 'Skip code quality checks (faster builds for debugging)'
        type: boolean
        default: false
      append_commit_hash:
        description: 'Append short commit hash to artifact names'
        type: boolean
        default: false
      upload_installers_only:
        description: 'Only upload primary installers (exe/msi/dmg/deb), skip zip/yml/blockmap'
        type: boolean
        default: false
      poundingcore_run_id:
        description: 'Optional poundingcore Manual Build workflow run id to bundle instead of the pinned release'
        type: string
        default: ''
      aff_code:
        description: 'Dealer affiliate code to inject into platform zip as dealer-config.json (enables invite chain binding)'
        type: string
        default: ''
      strict_vendor:
        description: 'Fail the build when critical vendor components (chrome-devtools-mcp / ACP bridges) fail to download. Release builds set this; PR/manual builds keep warning-level to avoid flaky US-runner network reds.'
        type: boolean
        default: false

env:
  BUN_INSTALL_REGISTRY: 'https://registry.npmjs.org/'
  # HUB is skipped in POUNDING builds (downloaded via preparePoundingcore.js instead)

jobs:
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_code_quality }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run postinstall
        run: bun run postinstall || true

      - name: Run ESLint
        run: bun run lint

      - name: Check Prettier formatting
        run: bun run format:check

      - name: TypeScript type check
        run: bunx tsc --noEmit

      - name: Run unit tests
        run: bunx vitest run

  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    needs: code-quality
    if: ${{ always() && (inputs.skip_code_quality || needs.code-quality.result == 'success') }}

    outputs:
      commit-short: ${{ steps.commit.outputs.short }}

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Get commit hash
        id: commit
        shell: bash
        run: |
          SHORT=$(git rev-parse --short HEAD)
          echo "short=$SHORT" >> $GITHUB_OUTPUT
          echo "Commit: $SHORT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Restore Electron/Electron-Builder caches before any build-related install
      - name: Cache Electron artifacts
        id: electron-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/.cache/electron
            ${{ runner.temp }}/.cache/electron-builder
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/AppData/Local/electron-builder/Cache
          key: electron-cache-${{ runner.os }}-${{ matrix.platform }}-${{ matrix.arch }}-${{ hashFiles('package.json', 'bun.lock') }}
          restore-keys: |
            electron-cache-${{ runner.os }}-${{ matrix.platform }}-${{ matrix.arch }}-

      - name: Cache status
        run: echo "electron-cache-hit=${{ steps.electron-cache.outputs.cache-hit }}"

      - name: Install dependencies
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: bun install --frozen-lockfile

      - name: Run postinstall
        run: bun run postinstall || true

      - name: Setup Windows native dependencies (for Windows only)
        if: startsWith(matrix.platform, 'windows')
        run: |
          bun install --global node-gyp

      - name: Install MSVC ARM64 toolchain (Windows ARM64 only)
        if: matrix.platform == 'windows-arm64'
        continue-on-error: true
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 20
          max_attempts: 3
          retry_wait_seconds: 60
          shell: pwsh
          command: |
            choco install visualstudio2022buildtools --yes --params "'--add Microsoft.VisualStudio.Component.VC.Tools.ARM64 --add Microsoft.VisualStudio.Component.Windows11SDK.22000 --includeRecommended --includeOptional'"

      - name: Setup Windows build environment (for Windows only)
        if: startsWith(matrix.platform, 'windows')
        run: |
          echo "Setting Windows SDK version for ConPty support"
          echo "WindowsTargetPlatformVersion=10.0.19041.0" >> $env:GITHUB_ENV

      - name: Setup MSBuild (for Windows only)
        if: startsWith(matrix.platform, 'windows')
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '17.0'

      - name: Rebuild native modules for Electron
        if: "!startsWith(matrix.platform, 'windows')"
        run: bunx electron-builder install-app-deps
        env:
          npm_config_runtime: electron
          npm_config_disturl: https://electronjs.org/headers
          ELECTRON_CACHE: ${{ runner.temp }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/.cache/electron-builder

      - name: Print build configuration
        shell: bash
        run: |
          echo "=========================================="
          echo "BUILD CONFIGURATION"
          echo "=========================================="
          echo "Platform: ${{ matrix.platform }}"
          echo "Target Architecture: ${{ matrix.arch }}"
          echo "Build Command: ${{ matrix.command }}"
          echo "Runner OS: ${{ runner.os }}"
          echo "Runner Arch: ${{ runner.arch }}"
          echo "Ref: ${{ inputs.ref || '(default)' }}"
          echo "Commit: ${{ steps.commit.outputs.short }}"
          echo "=========================================="

      - name: Resolve Sentry release name
        # windows-11-arm 上 Git Bash（x86_64/WoW64 模拟）被 arm64 runner
        # 拉起时偶发启动失败（exit 0x80000004，见 actions/runner-images#14052）。
        # 该步骤只读 package.json + 写 GITHUB_ENV，改用 PowerShell 规避。
        shell: pwsh
        run: |
          $VERSION = node -p "require('./package.json').version"
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $RELEASE_NAME = $env:GITHUB_REF_NAME
          } elseif ($env:GITHUB_REF_NAME -eq 'dev') {
            $RELEASE_NAME = "v$VERSION-dev-${{ steps.commit.outputs.short }}"
          } else {
            $RELEASE_NAME = "v$VERSION-${{ steps.commit.outputs.short }}"
          }
          Add-Content -Path $env:GITHUB_ENV -Value "SENTRY_RELEASE=$RELEASE_NAME"
          Write-Output "Sentry release: $RELEASE_NAME"

      - name: Configure Sentry source map upload owner
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ matrix.platform }}" == "linux-x64" ]]; then
            echo "SENTRY_UPLOAD_SOURCE_MAPS=true" >> "$GITHUB_ENV"
            echo "Sentry source maps will be uploaded by linux-x64"
          else
            echo "SENTRY_UPLOAD_SOURCE_MAPS=false" >> "$GITHUB_ENV"
            echo "Sentry source map upload skipped for ${{ matrix.platform }}"
          fi

      - name: Validate Sentry source map upload configuration
        if: matrix.platform == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          missing=0

          for name in SENTRY_AUTH_TOKEN SENTRY_ORG SENTRY_PROJECT SENTRY_RELEASE; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Sentry configuration missing::$name is required for desktop source map uploads"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          echo "Sentry source map upload configured for $SENTRY_ORG/$SENTRY_PROJECT ($SENTRY_RELEASE)"
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}

      # macOS code signing certificate installation
      - name: Setup macOS code signing (macOS only)
        if: startsWith(matrix.platform, 'macos')
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'temp-keychain-password' }}
        run: |
          if [ -n "$BUILD_CERTIFICATE_BASE64" ]; then
            echo "Installing code signing certificate..."

            # Create certificate file
            echo $BUILD_CERTIFICATE_BASE64 | base64 --decode > certificate.p12

            # Create temporary keychain
            security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
            security default-keychain -s build.keychain
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain

            # Import certificate
            security import certificate.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

            # Clean up certificate file
            rm certificate.p12

            echo "Certificate imported successfully"
          else
            echo "No certificate provided - building unsigned application"
            echo "To enable code signing, add BUILD_CERTIFICATE_BASE64 and P12_PASSWORD secrets"
          fi

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 python3-pip pkg-config libsqlite3-dev fakeroot dpkg-dev rpm libnss3-dev libatk-bridge2.0-dev libdrm2 libxkbcommon-dev libxss1 libatspi2.0-dev libgtk-3-dev libxrandr2 libasound2-dev

      - name: Rebuild native modules for Electron (Windows)
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        continue-on-error: false
        run: |
          $arch = "${{ matrix.arch }}"
          $electronVer = (node -p "require('./package.json').devDependencies.electron.replace(/[\^~]/g, '')").Trim()

          Write-Host "=========================================="
          Write-Host "Rebuilding native modules for Electron $electronVer ($arch)"
          Write-Host "=========================================="

          # Strategy: Try prebuild-install first (faster, more reliable)
          # Fallback to electron-rebuild only if prebuild-install fails
          $success = $false

          # Step 1: Try prebuild-install (downloads prebuilt binaries)
          Write-Host ""
          Write-Host "[Step 1] Trying prebuild-install..."
          $prebuildResult = $null
          try {
          $prebuildResult = bun x --yes prebuild-install --runtime=electron --target=$electronVer --platform=win32 --arch=$arch --force 2>&1
            if ($LASTEXITCODE -eq 0) {
              Write-Host "✅ prebuild-install succeeded"
              $success = $true
            } else {
              Write-Host "⚠️ prebuild-install exited with code $LASTEXITCODE"
            }
          } catch {
            Write-Host "⚠️ prebuild-install failed: $_"
          }

          # Step 2: Verify or fallback to electron-rebuild
          $sqliteNode = "node_modules/better-sqlite3/build/Release/better_sqlite3.node"
          if (-not (Test-Path $sqliteNode)) {
            Write-Host ""
            Write-Host "[Step 2] prebuild-install didn't produce binary, trying electron-rebuild..."
            try {
              bunx electron-rebuild -f -w better-sqlite3
              if ($LASTEXITCODE -eq 0) {
                Write-Host "✅ electron-rebuild succeeded"
                $success = $true
              }
            } catch {
              Write-Warning "electron-rebuild failed: $_"
              echo "::warning title=Native Rebuild Failed::electron-rebuild failed for better-sqlite3 — non-fatal"
            }
          }

          # Final verification
          Write-Host ""
          Write-Host "Verifying native modules..."
          if (Test-Path $sqliteNode) {
            $size = [math]::Round((Get-Item $sqliteNode).Length / 1MB, 1)
            Write-Host "✅ better-sqlite3 found: $sqliteNode ($size MB)"
          } else {
            Write-Host "⚠️ better-sqlite3 native module not found at: $sqliteNode"
            Write-Host "Non-fatal — app will still build and can use better-sqlite3 at runtime"
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "✅ All critical native modules verified"
          Write-Host "=========================================="
          exit 0
        env:
          npm_config_runtime: electron
          npm_config_arch: ${{ matrix.arch }}
          npm_config_target_arch: ${{ matrix.arch }}
          npm_config_disturl: https://electronjs.org/headers
          # Don't force build_from_source - let prebuild-install try first
          MSVS_VERSION: 2022
          GYP_MSVS_VERSION: 2022

      - name: Vendor managed runtimes (MCP, ACP)
        id: vendor-runtimes
        shell: bash
        # release 构建（strict_vendor=true）硬失败：内置 MCP / ACP bridges 缺失
        # 不 shipping。pr-checks/手动构建保持 warning（US runner 网络抖动不红 PR）。
        continue-on-error: ${{ !inputs.strict_vendor }}
        run: |
          # Output to vendor/managed-resources/ — preparePoundingcore.js
          # copies from there into the app bundle below.
          mkdir -p vendor/managed-resources
          TARGET_KEY="${{ matrix.platform == 'macos-arm64' && 'darwin-arm64' || matrix.platform == 'macos-x64' && 'darwin-x64' || matrix.platform == 'windows-x64' && 'win32-x64' || matrix.platform == 'windows-arm64' && 'win32-arm64' }}"
          if [ "${{ inputs.strict_vendor }}" == "true" ]; then
          # prepare-vendor.sh 内部已聚合关键组件退出码
            bash scripts/prepare-vendor.sh vendor/managed-resources "$TARGET_KEY"
            echo "vendor-ok=true" >> "$GITHUB_OUTPUT"
          else
            if bash scripts/prepare-vendor.sh vendor/managed-resources "$TARGET_KEY"; then
              echo "vendor-ok=true" >> "$GITHUB_OUTPUT"
            else
              echo "vendor-ok=false" >> "$GITHUB_OUTPUT"
              echo "::warning title=Vendor Incomplete::Managed runtimes vendor step failed — builtin MCP / ACP bridges may be missing"
            fi
          fi

      - name: Verify vendored bundle integrity (early feedback, non-fatal)
        id: verify-vendor
        shell: bash
        run: |
          # Fast structure/manifest validation of the vendor output. The hard
          # gate lives in afterPack.js (fails the build on missing builtin MCP /
          # ACP) — this step just surfaces problems early.
          if bash scripts/verify-bundle-integrity.sh --vendor-only --platform "${{ matrix.platform == 'macos-arm64' && 'darwin-arm64' || matrix.platform == 'macos-x64' && 'darwin-x64' || matrix.platform == 'windows-x64' && 'win32-x64' || matrix.platform == 'windows-arm64' && 'win32-arm64' }}" vendor/managed-resources; then
            echo "verify-vendor-ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "verify-vendor-ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Vendor Integrity Incomplete::verify-bundle-integrity.sh reported problems (afterPack will hard-fail if critical components are missing)"
          fi
        continue-on-error: true # mirrors vendor step: warning-level here, hard gate in afterPack

      - name: Prepare packaged backend binary
        id: prepare-backend
        shell: bash
        run: |
          if node scripts/preparePoundingcore.js 2>&1 | tee /tmp/prepare-pound.log; then
            echo "prepare-ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "prepare-ok=false" >> "$GITHUB_OUTPUT"
            echo "::error title=Prepare Backend Failed::$(tail -20 /tmp/prepare-pound.log | tr '\n' ' ')"
            exit 1
          fi
        env:
          # Version is pinned in repo-root package.json (poundingcoreVersion field).
          # Override POUNDINGCORE_VERSION for ad-hoc builds.
          # POUNDINGCORE_GITHUB_OWNER/REPO point to our private backend fork.
          POUNDINGCORE_GITHUB_OWNER: halojerry
          POUNDINGCORE_GITHUB_REPO: poundingcore
          POUNDING_BACKEND_ARCH: ${{ matrix.arch }}
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build with electron-builder (Windows)
        if: startsWith(matrix.platform, 'windows')
        id: windows-build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Command = $env:WINDOWS_BUILD_COMMAND
          $BuildFailed = $false

          try {
            Write-Host "Running Windows build command: $Command"
            iex $Command
            if ($LASTEXITCODE -ne 0) {
              throw "Build command failed with exit code $LASTEXITCODE"
            }
            Write-Host "Windows build completed successfully"
          } catch {
            $BuildFailed = $true
            $errorMessage = "$_"
            Write-Warning "${{ matrix.platform }} build failed: $errorMessage"
            echo "::warning title=${{ matrix.platform }} Build Failed::$errorMessage"
          }

          if ($BuildFailed) {
            # Upload build logs even on failure for debugging
            if (Test-Path "$env:LOCALAPPDATA\electron-builder\logs") {
              Get-ChildItem "$env:LOCALAPPDATA\electron-builder\logs" -Name
            }
            "result=failure" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit 1
          } else {
            "result=success" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }
        env:
          WINDOWS_BUILD_COMMAND: ${{ matrix.command }}
          # Node.js memory limit for vite bundling (prevents OOM during build)
          # Node.js 内存限制，防止 vite 打包时内存不足
          NODE_OPTIONS: '--max-old-space-size=8192'
          # Target arch / 目标架构
          npm_config_arch: ${{ matrix.arch }}
          npm_config_target_arch: ${{ matrix.arch }}
          # Native module compilation / 原生模块编译
          npm_config_runtime: electron
          npm_config_disturl: https://electronjs.org/headers
          npm_config_build_from_source: true
          npm_config_cache: ${{ runner.temp }}/.npm
          ELECTRON_CACHE: ${{ runner.temp }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/.cache/electron-builder
          # Signing & IDs / 签名与应用 ID 配置
          APP_ID: ${{ secrets.APP_ID }}
          appleId: ${{ secrets.APPLE_ID }}
          appleIdPassword: ${{ secrets.APPLE_ID_PASSWORD }}
          teamId: ${{ secrets.TEAM_ID }}
          identity: ${{ secrets.IDENTITY }}
          CSC_NAME: ${{ secrets.IDENTITY }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # Windows build flags / Windows 构建参数
          MSVS_VERSION: 2022
          GYP_MSVS_VERSION: 2022
          WindowsTargetPlatformVersion: 10.0.19041.0
          _WIN32_WINNT: 0x0A00
          # Sentry DSN (injected at build time via vite define)
          SENTRY_DSN: ${{ secrets.SENTRY_DSN != '' && secrets.SENTRY_DSN || vars.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG != '' && secrets.SENTRY_ORG || vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT != '' && secrets.SENTRY_PROJECT || vars.SENTRY_PROJECT }}
          # CI flag & GitHub token / CI 标识与 GitHub Token
          CI: true
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      # Clean up any stale disk images before DMG creation (macOS only)
      # 清理可能残留的磁盘镜像，避免 hdiutil "Device not configured" 错误
      - name: Clean up stale disk images (macOS only)
        if: startsWith(matrix.platform, 'macos')
        run: |
          echo "Cleaning up any stale disk images..."
          # Detach any mounted disk images
          hdiutil info 2>/dev/null | grep '/dev/disk' | awk '{print $1}' | while read disk; do
            echo "Detaching $disk..."
            hdiutil detach "$disk" -force 2>/dev/null || true
          done
          # Clean up any temporary DMG files
          rm -f /tmp/*.dmg 2>/dev/null || true
          echo "Cleanup complete"

      # macOS: Build with notarization - DMG failure = CI failure, notarization failure = warning only
      # macOS: 构建并公证 - DMG 失败 = CI 失败，公证失败 = 仅警告
      - name: Build with electron-builder (macOS)
        if: startsWith(matrix.platform, 'macos')
        id: macos-build
        shell: bash
        run: |
          set +e  # Handle errors manually

          # Run build command
          ${{ matrix.command }} 2>&1 | tee "${RUNNER_TEMP}/build.log"
          BUILD_EXIT_CODE=${PIPESTATUS[0]}

          # Check if DMG was created (most important artifact)
          DMG_EXISTS=false
          if ls out/*.dmg 1>/dev/null 2>&1; then
            DMG_EXISTS=true
            echo "✅ DMG created successfully"
          fi

          # If build succeeded completely
          if [ $BUILD_EXIT_CODE -eq 0 ]; then
            echo "✅ Build completed successfully"
            echo "notarization_status=success" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Build failed - check if it's just notarization failure
          if [ "$DMG_EXISTS" = true ]; then
            # DMG exists but build failed - likely notarization issue
            if grep -qiE "notariz|staple" "${RUNNER_TEMP}/build.log"; then
              echo "⚠️ DMG created but notarization failed"
              echo "notarization_status=failed" >> $GITHUB_OUTPUT
              echo "::warning title=Notarization Failed::DMG was built and signed successfully, but **notarization failed**."
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "## ⚠️ Notarization Warning" >> $GITHUB_STEP_SUMMARY
              echo "DMG was built and signed successfully, but **notarization failed**." >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "Users may see Gatekeeper warnings when opening the app for the first time." >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "To fix: Right-click the app → Open → Open" >> $GITHUB_STEP_SUMMARY
              exit 0  # Allow CI to continue
            fi
          fi

          # DMG doesn't exist or other fatal error - fail CI
          echo "❌ Build failed - DMG was not created"
          echo "notarization_status=build_failed" >> $GITHUB_OUTPUT
          exit 1
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
          npm_config_arch: ${{ matrix.arch }}
          APP_ID: ${{ secrets.APP_ID }}
          appleId: ${{ secrets.APPLE_ID }}
          appleIdPassword: ${{ secrets.APPLE_ID_PASSWORD }}
          teamId: ${{ secrets.TEAM_ID }}
          identity: ${{ secrets.IDENTITY }}
          CSC_NAME: ${{ secrets.IDENTITY }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          npm_config_cache: ${{ runner.temp }}/.npm
          ELECTRON_CACHE: ${{ runner.temp }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/.cache/electron-builder
          ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/
          npm_config_electron_builder_binaries_mirror: https://github.com/electron-userland/electron-builder-binaries/releases/download/
          ELECTRON_MIRROR: ''
          npm_config_disturl: https://electronjs.org/headers
          npm_config_runtime: electron
          npm_config_target_arch: ${{ matrix.arch }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN != '' && secrets.SENTRY_DSN || vars.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG != '' && secrets.SENTRY_ORG || vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT != '' && secrets.SENTRY_PROJECT || vars.SENTRY_PROJECT }}
          CI: true
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      # Linux: Standard build without special error handling
      # Linux: 标准构建，无特殊错误处理
      - name: Build with electron-builder (Linux)
        if: startsWith(matrix.platform, 'linux')
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 60
          max_attempts: 2
          retry_wait_seconds: 60
          command: ${{ matrix.command }}
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
          npm_config_arch: ${{ matrix.arch }}
          npm_config_cache: ${{ runner.temp }}/.npm
          ELECTRON_CACHE: ${{ runner.temp }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/.cache/electron-builder
          ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/
          npm_config_electron_builder_binaries_mirror: https://github.com/electron-userland/electron-builder-binaries/releases/download/
          ELECTRON_MIRROR: ''
          npm_config_disturl: https://electronjs.org/headers
          npm_config_runtime: electron
          npm_config_target_arch: ${{ matrix.arch }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN != '' && secrets.SENTRY_DSN || vars.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG != '' && secrets.SENTRY_ORG || vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT != '' && secrets.SENTRY_PROJECT || vars.SENTRY_PROJECT }}
          CI: true
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      # macOS 钥匙串清理
      - name: Clean up keychain (macOS only)
        if: startsWith(matrix.platform, 'macos') && always()
        run: |
          if security list-keychains | grep -q build.keychain; then
            security delete-keychain build.keychain
            echo "Temporary keychain deleted"
          fi

      # macOS 构建失败通知
      # macOS build failure notification
      - name: Notify on macOS build failure
        if: startsWith(matrix.platform, 'macos') && failure()
        run: |
          echo "::error title=macOS Build Failed::Build failed. Check the logs for details."
          echo ""
          echo "❌ macOS Build Failed"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "Common causes:"
          echo "  • hdiutil/DMG creation failure (Device not configured)"
          echo "  • Code signing issues"
          echo "  • Notarization timeout"
          echo "  • Out of memory (OOM)"
          echo ""
          echo "Check the build logs above for the specific error."
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: List build artifacts
        if: success() || failure()
        shell: bash
        run: |
          echo "=========================================="
          echo "BUILD ARTIFACTS"
          echo "=========================================="
          if [ -d "out" ]; then
            ls -lh out/ || true
            echo "=========================================="
            echo "Total artifacts:"
            find out/ -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.dmg" -o -name "*.deb" -o -name "*.zip" -o -name "*.yml" \) -exec basename {} \; || true
          else
            echo "No out directory found!"
          fi

      # Verify desktop asar does not contain packages/web-cli/ contamination
      # 验证桌面 asar 没有被 web-cli 代码污染

      # Inject PORTABLE marker (always) + dealer invite code (when AFF_CODE set)
      # into the platform zip. PORTABLE is required for the portable zip to work:
      #   - userData lands in exe-dir/data/ (data not written to %APPDATA%)
      #   - single-instance lock auto-isolates per exe dir (no more "double-click
      #     does nothing" from colliding with an installed copy's lock)
      # 经销商邀请码注入 — 将 PORTABLE 无条件 + dealer-config.json(aff_code 非空时)
      # 注入平台 zip。注意：仅 zip（U盘/便携）支持经销商自配；exe/dmg 安装包签名后
      # 无法注入（macOS 往 .app 写文件会破坏签名），需要 exe/dmg 经销商绑定走
      # workflow_dispatch 传 aff_code 预埋（库存 release 不注入，aff_code 默认空）。
      - name: Inject dealer invite code
        if: >-
          success() &&
          (!startsWith(matrix.platform, 'windows') || steps.windows-build.outputs.result == 'success')
        shell: bash
        env:
          AFF_CODE: ${{ inputs.aff_code }}
        run: |
          # electron-builder artifactName uses ${os} = win/mac (not windows/macos).
          # Map matrix platform → zip artifact name suffix.
          case "${{ matrix.platform }}" in
            windows-x64)   ZIP_SUFFIX="win-x64" ;;
            windows-arm64) ZIP_SUFFIX="win-arm64" ;;
            macos-arm64)   ZIP_SUFFIX="mac-arm64" ;;
            macos-x64)     ZIP_SUFFIX="mac-x64" ;;
            *)             ZIP_SUFFIX="${{ matrix.platform }}" ;;
          esac
          PLATFORM_ZIP=$(ls out/POUNDING-*-${ZIP_SUFFIX}.zip 2>/dev/null | head -1)
          if [ -z "$PLATFORM_ZIP" ]; then
            echo "::warning::No platform zip found for ${{ matrix.platform }} (glob -${ZIP_SUFFIX}.zip), skipping PORTABLE/dealer inject"
            exit 0
          fi
          bash scripts/pack-usb-zip.sh "$PLATFORM_ZIP" "$AFF_CODE"

      # Verify the platform zip actually carries the PORTABLE marker (and, when
      # an affiliate code was given, dealer-config.json). Without PORTABLE the
      # extracted zip shares %APPDATA% + the single-instance lock with the
      # installed version and silently exits on double-click (v2.1.41 bug, PR #17).
      # This gate runs on every release build so a future glob/name regression
      # fails the build instead of shipping a broken portable zip.
      - name: Verify PORTABLE marker in platform zip
        if: >-
          success() &&
          (!startsWith(matrix.platform, 'windows') || steps.windows-build.outputs.result == 'success')
        shell: bash
        env:
          AFF_CODE: ${{ inputs.aff_code }}
        run: |
          set -euo pipefail
          # electron-builder artifactName uses ${os} = win/mac (not windows/macos).
          case "${{ matrix.platform }}" in
            windows-x64)   ZIP_SUFFIX="win-x64" ;;
            windows-arm64) ZIP_SUFFIX="win-arm64" ;;
            macos-arm64)   ZIP_SUFFIX="mac-arm64" ;;
            macos-x64)     ZIP_SUFFIX="mac-x64" ;;
            *)             ZIP_SUFFIX="${{ matrix.platform }}" ;;
          esac
          PLATFORM_ZIP=$(ls out/POUNDING-*-${ZIP_SUFFIX}.zip 2>/dev/null | head -1)
          if [ -z "$PLATFORM_ZIP" ]; then
            echo "::error::No platform zip found for ${{ matrix.platform }} (glob -${ZIP_SUFFIX}.zip); cannot verify PORTABLE marker"
            exit 1
          fi
          python3 - "$PLATFORM_ZIP" "$AFF_CODE" <<'PY'
          import os, sys, zipfile
          zip_path, aff_code = sys.argv[1], sys.argv[2]
          names = zipfile.ZipFile(zip_path).namelist()
          base = {os.path.basename(n) for n in names}
          missing = []
          if 'PORTABLE' not in base:
              missing.append('PORTABLE')
          if aff_code and 'dealer-config.json' not in base:
              missing.append('dealer-config.json')
          if missing:
              print(f"::error::{zip_path} is missing required marker(s): {', '.join(missing)}")
              print('zip entries:', sorted(names)[:20])
              sys.exit(1)
          print("OK: " + zip_path + " carries PORTABLE" + (" + dealer-config.json" if aff_code else ""))
          PY

      - name: Verify desktop asar isolation
        if: >-
          success() &&
          (!startsWith(matrix.platform, 'windows') || steps.windows-build.outputs.result == 'success')
        shell: bash
        run: |
          set -euo pipefail
          ASAR=$(find out -type f -name 'app.asar' -not -path '*node_modules*' | head -n 1 || true)
          if [ -z "$ASAR" ]; then
            echo "::notice::No app.asar found for ${{ matrix.platform }}, skipping isolation check"
            exit 0
          fi
          echo "Inspecting $ASAR for web-cli leakage..."
          LEAK_COUNT=$(bunx @electron/asar list "$ASAR" 2>/dev/null | grep -cE '^/packages/web-cli(/|$)' || true)
          if [ "$LEAK_COUNT" != "0" ]; then
            echo "::error::Desktop asar contains $LEAK_COUNT web-cli entries:"
            bunx @electron/asar list "$ASAR" | grep -E '^/packages/web-cli(/|$)' | head -20
            exit 1
          fi
          echo "✅ asar isolation verified: no packages/web-cli entries"

      # Upload artifacts when:
      # - Build succeeded (all platforms)
      # - macOS: notarization timeout but artifacts exist (handled in build step)
      # - Windows: only if windows-build step succeeded
      # 上传产物条件：
      # - 构建成功（所有平台）
      # - macOS: 公证超时但有产物（已在构建步骤中处理）
      # - Windows: 仅当 windows-build 步骤成功
      - name: Clean up non-installer artifacts
        if: >-
          inputs.upload_installers_only && success() &&
          (!startsWith(matrix.platform, 'windows') || steps.windows-build.outputs.result == 'success')
        shell: bash
        run: |
          echo "Removing non-installer files from out/ ..."
          rm -f out/*.blockmap out/*.zip out/*.yml out/builder-debug.yml 2>/dev/null || true
          echo "Remaining artifacts:"
          ls -lh out/ || true

      # OOB Gate：release 构建时真实启动本 job 打包产物，验证开箱即用
      # （应用启动 + 后端就绪 + 内置 MCP 默认启用）。CLI（claude/hermes/
      # openclaw）不在安装器内捆绑，缺失为非阻断 warn（助手页自助安装）。
      # 失败 → release job 失败，宁可不发也不发 MCP 不默认开的包。
      # 仅 Windows/macOS 主平台（Linux 不是主要客户群，跳过省时间）。
      - name: Verify OOB app startup + builtin MCP
        if: >-
          success() &&
          inputs.strict_vendor &&
          (startsWith(matrix.platform, 'windows') || startsWith(matrix.platform, 'macos')) &&
          (!startsWith(matrix.platform, 'windows') || steps.windows-build.outputs.result == 'success')
        shell: bash
        env:
          CI: 'true'
          E2E_PACKAGED: '1'
          E2E_OOB_GATE: '1'
          E2E_SCREENSHOTS: '0'
          BUN_INSTALL_REGISTRY: 'https://registry.npmjs.org/'
          # macos-x64 产物在 macos-14(arm64) runner 上经 Rosetta 运行，架构
          # 守卫（architectureCompatibility.ts）会拒绝启动后端。这里仅对
          # CI OOB 放行（POUNDING_ALLOW_ROSETTA=1），真实用户行为不变。
          POUNDING_ALLOW_ROSETTA: ${{ matrix.platform == 'macos-x64' && '1' || '' }}
          # Rosetta 下后端冷启动 + 首启物化更慢，给 macos-x64 更长的就绪窗口。
          E2E_BACKEND_READY_SECONDS: ${{ matrix.platform == 'macos-x64' && '300' || '120' }}
        run: |
          set -euo pipefail
          echo "OOB Gate: launching packaged app from out/ to verify startup + builtin MCP"
          bunx playwright test --config playwright.config.ts \
            tests/e2e/specs/oob-cli-install.e2e.ts \
            tests/e2e/specs/pounding-portable-mode.e2e.ts \
            --reporter=line --workers=1

      # Windows install smoke (仅 windows-x64)：静默安装 NSIS 包，解压阶段
      # 超过 5 分钟即失败（慢 lzma + AV 扫描是用户报的"卡一半"症状）。
      # 实测 windows-2022 上 x64 静默安装 79s；windows-11-arm 上 arm64 安装器
      # 在模拟层解压 20 分钟仍未完成（与卡死无关，是 WoW64 模拟慢），因此该
      # 门禁只对 x64 生效，arm64 由 OOB 门禁（启动+后端+MCP）覆盖。
      # timeout-minutes 兜底：安装器一旦卡死，默认 360 分钟的步骤超时会让
      # 整个 job 白烧数小时（DURATION 断言在安装器返回之后才执行，卡死时
      # 永远不会触发）。
      - name: Verify NSIS installer completes quickly (Windows)
        if: >-
          success() &&
          inputs.strict_vendor &&
          matrix.platform == 'windows-x64'
        # 用 pwsh 而非 Git Bash：① bash 会把 `/S` 当 POSIX 路径转换成
        # `C:/Program Files/Git/S`，NSIS 收到坏参数后不进入静默模式，而是弹
        # GUI 向导挂在交互会话里等点击（本次 run 卡 100+ 分钟的根因）；
        # ② 顺带规避 windows-11-arm 上 Git Bash 偶发崩溃（runner-images#14052）。
        shell: pwsh
        timeout-minutes: 20
        run: |
          $ErrorActionPreference = 'Stop'
          $SUFFIX = if ('${{ matrix.platform }}' -eq 'windows-x64') { 'win-x64' } else { 'win-arm64' }
          $INSTALLER = Get-ChildItem "out/POUNDING-*-$SUFFIX.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $INSTALLER) {
            Write-Error "No NSIS installer found for ${{ matrix.platform }} (glob -*$SUFFIX.exe)"
            exit 1
          }

          # OOB 门禁可能残留 POUNDING.exe，先清掉，避免安装器等待/文件占用。
          Stop-Process -Name POUNDING -Force -ErrorAction SilentlyContinue

          # Defender 实时扫描会把未签名 324MB 安装包的解压拖到几十分钟甚至
          # 更久（用户"卡一半"在 CI 同样复现）。冒烟只验证安装器逻辑，关闭
          # 实时监控；真实用户的 AV 延迟由 Authenticode 签名（CSC_LINK）解决。
          try {
            Set-MpPreference -DisableRealtimeMonitoring $true
          } catch {
            Write-Warning "无法关闭 Defender 实时监控，安装冒烟可能超时: $($_.Exception.Message)"
          }

          Write-Output "Running silent install of $($INSTALLER.Name)..."
          $START = Get-Date
          # PowerShell 不经过 Git Bash 的 POSIX 路径转换，/S 与 /D= 原样传给 NSIS。
          $PROC = Start-Process -FilePath $INSTALLER.FullName -ArgumentList '/S', '/D=C:\pounding-smoke-install' -Wait -PassThru
          $DURATION = ((Get-Date) - $START).TotalSeconds
          Write-Output "install-smoke-seconds=$([math]::Round($DURATION, 1))"
          if ($PROC.ExitCode -ne 0) {
            Write-Error "NSIS installer exited with code $($PROC.ExitCode)"
            exit 1
          }
          Stop-Process -Name POUNDING -Force -ErrorAction SilentlyContinue
          if ($DURATION -ge 300) {
            Write-Error "NSIS install took $([math]::Round($DURATION, 1))s (>= 300s) — extraction stuck"
            exit 1
          }
          Write-Output "✅ NSIS silent install completed in $([math]::Round($DURATION, 1))s"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        if: >-
          success() &&
          (!startsWith(matrix.platform, 'windows') || steps.windows-build.outputs.result == 'success')
        with:
          name: ${{ inputs.append_commit_hash && format('{0}-{1}', matrix.artifact-name, steps.commit.outputs.short) || matrix.artifact-name }}
          path: |
            out/*.exe
            out/*.msi
            out/*.dmg
            out/*.deb
            out/*.zip
            out/*.yml
          if-no-files-found: error
          retention-days: 7

  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [code-quality, build]
    if: always()

    steps:
      - name: Write build summary
        env:
          MATRIX: ${{ inputs.matrix }}
        run: |
          PLATFORMS=$(echo "$MATRIX" | jq -r '[.include[].platform] | join(", ")')

          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Key | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Ref | \`${{ inputs.ref || '(default)' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ needs.build.outputs.commit-short }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Platforms | $PLATFORMS |" >> $GITHUB_STEP_SUMMARY
          echo "| Code Quality | ${{ needs.code-quality.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
