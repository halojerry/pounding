name: Build and Release

permissions:
  contents: write
  issues: read
  pull-requests: read
  actions: write

on:
  push:
    branches:
      # 仅 release/ 分支推送触发全量构建（发布流程）。普通开发/合并 main/
      # feature/ 不再触发 —— 验证由 pr-checks 的 Build Test 承担，避免每次
      # push 烧 4 平台 ~2h 的 Actions 分钟（欠费主因）。
      - 'release/**'
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to build manually (default: current ref)'
        required: false
        type: string
      manual_tag_name:
        description: 'Manual release tag name, e.g. v2.0.2 or v2.0.3-rc.1'
        required: false
        type: string
      manual_prerelease:
        description: 'Mark the manually created release as prerelease'
        required: false
        default: false
        type: boolean
      manual_dev_release:
        description: 'Force draft prerelease flow for testing'
        required: false
        default: true
        type: boolean
      aff_code:
        description: 'Dealer affiliate code — when set, injects dealer-config.json into platform zips for invite chain'
        required: false
        default: ''
        type: string

env:
  BUN_INSTALL_REGISTRY: 'https://registry.npmjs.org/'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # 独立 code-quality job,供桌面构建和 web-cli 打包共用,避免重复跑
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    if: |
      !startsWith(github.ref, 'refs/tags/') &&
      (
        github.event_name == 'workflow_dispatch' ||
        github.ref == 'refs/heads/main' ||
        startsWith(github.ref, 'refs/heads/feature/') ||
        startsWith(github.ref, 'refs/heads/release/')
      )
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run postinstall
        run: bun run postinstall || true

      - name: Run ESLint
        run: bun run lint

      - name: Check Prettier formatting
        run: bun run format:check

      - name: TypeScript type check
        run: bunx tsc --noEmit

      - name: Run unit tests
        run: bunx vitest run

  build-pipeline:
    name: Build Pipeline
    uses: ./.github/workflows/_build-reusable.yml
    needs: code-quality
    # main/feature/release 分支触发构建；tag push 跳过（create-tag job 推送的 tag 会触发重复构建）
    if: |
      !cancelled() &&
      !startsWith(github.ref, 'refs/tags/') &&
      (
        github.event_name == 'workflow_dispatch' ||
        github.ref == 'refs/heads/main' ||
        startsWith(github.ref, 'refs/heads/feature/') ||
        startsWith(github.ref, 'refs/heads/release/')
      )
    with:
      skip_code_quality: true
      # release 构建：关键 vendor 组件下载失败 → 硬失败（不 shipping 残缺 bundle）
      strict_vendor: true
      aff_code: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.aff_code || '' }}
      ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || '' }}
      matrix: >-
        {"include":[
          {"platform":"macos-arm64","os":"macos-14","command":"node scripts/build-with-builder.js arm64 --mac --arm64","artifact-name":"macos-build-arm64","arch":"arm64"},
          {"platform":"macos-x64","os":"macos-14","command":"node scripts/build-with-builder.js x64 --mac --x64","artifact-name":"macos-build-x64","arch":"x64"},
          {"platform":"windows-x64","os":"windows-2022","command":"node scripts/build-with-builder.js x64 --win --x64 --skip-prepare","artifact-name":"windows-build-x64","arch":"x64"},
          {"platform":"windows-arm64","os":"windows-11-arm","command":"node scripts/build-with-builder.js arm64 --win --arm64 --skip-prepare","artifact-name":"windows-build-arm64","arch":"arm64"}
        ]}
    secrets: inherit

  pack-web-cli:
    name: Pack Web CLI
    uses: ./.github/workflows/pack-web-cli.yml
    needs: code-quality
    with:
      ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || '' }}
      append_commit_hash: false
      skip_code_quality: true
    secrets: inherit

  # 自动重试 workflow（当构建失败时）
  auto-retry-workflow:
    name: Auto Retry on Build Failure
    runs-on: ubuntu-latest
    needs: build-pipeline
    # 关键：只在首次失败时触发，避免无限循环
    if: |
      failure() &&
      github.run_attempt == 1 &&
      (github.event_name == 'push' || github.event_name == 'schedule')

    steps:
      - name: Log retry information
        run: |
          echo "=========================================="
          echo "🔄 Auto retry triggered (first failure)"
          echo "=========================================="
          echo "Build failed on first attempt, preparing auto retry..."
          echo "Current attempt: ${{ github.run_attempt }}"
          echo "Wait strategy: 5 minutes cooldown before retry"
          echo "=========================================="

      - name: Wait before retry (5 min cooldown)
        run: |
          echo "⏳ Waiting 5 minutes before retry..."
          echo "Start: $(date)"
          sleep 300
          echo "End: $(date)"
          echo "Triggering retry..."

      - name: Trigger workflow rerun
        run: |
          echo "🔄 Triggering full workflow rerun (attempt 2)..."

          # Use re-run API (not rerun-failed-jobs, to avoid loops)
          response=$(curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -w "\n%{http_code}" \
            https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/rerun)

          http_code=$(echo "$response" | tail -n1)

          if [ "$http_code" = "201" ]; then
            echo ""
            echo "✅ Retry triggered successfully"
            echo "This will be attempt 2"
            echo "Details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            echo ""
            echo "❌ Retry trigger failed, HTTP status: $http_code"
            echo "Response:"
            echo "$response" | head -n-1
            exit 1
          fi

  # 自动创建tag（仅 release 分支推送时；main/feature 只做验证）
  create-tag:
    name: Create Tag from Branch
    runs-on: ubuntu-latest
    needs: [build-pipeline]
    if: needs.build-pipeline.result == 'success' && (startsWith(github.ref, 'refs/heads/release/') || github.event_name == 'workflow_dispatch')
    outputs:
      tag_name: ${{ steps.create_tag.outputs.tag_name }}
      is_dev: ${{ steps.create_tag.outputs.is_dev }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # Prefer PAT when configured; fall back to GitHub-provided token so checkout itself never fails.
          token: ${{ secrets.GH_TOKEN != '' && secrets.GH_TOKEN || github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Create and push tag
        id: create_tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          COMMIT_SHORT=$(git rev-parse --short HEAD)
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          MANUAL_DEV_RELEASE="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.manual_dev_release || 'false' }}"
          MANUAL_TAG_NAME="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.manual_tag_name || '' }}"
          MANUAL_PRERELEASE="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.manual_prerelease || 'false' }}"

          if [ -n "$MANUAL_TAG_NAME" ]; then
            TAG_NAME="$MANUAL_TAG_NAME"
            if [ "$MANUAL_PRERELEASE" = "true" ]; then
              IS_DEV="true"
              echo "🧪 Manual prerelease requested: $TAG_NAME"
            else
              IS_DEV="false"
              echo "🚀 Manual stable release requested: $TAG_NAME"
            fi

            echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
            echo "is_dev=$IS_DEV" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 根据分支确定 tag 格式
          if [ "$MANUAL_DEV_RELEASE" = "true" ]; then
            TAG_NAME="v${VERSION}-dev-${COMMIT_SHORT}"
            IS_DEV="true"
            echo "🔧 Development release: $TAG_NAME"
          else
            TAG_NAME="v$VERSION"
            IS_DEV="false"
            echo "🚀 Production release: $TAG_NAME"
          fi

          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "is_dev=$IS_DEV" >> $GITHUB_OUTPUT

          # 检查远程tag是否已存在
          if git ls-remote --tags origin | grep -q "refs/tags/$TAG_NAME$"; then
            if [ "$IS_DEV" = "false" ]; then
              # Release 分支：需要递增版本并修改 package.json
              echo "⚠️ Tag $TAG_NAME already exists, auto-incrementing version..."

              if [[ $VERSION =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
                MAJOR=${BASH_REMATCH[1]}
                MINOR=${BASH_REMATCH[2]}
                PATCH=${BASH_REMATCH[3]}
                NEW_PATCH=$((PATCH + 1))
                NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"

                echo "📝 Updating package.json version to $NEW_VERSION"

                # 更新 package.json 版本号
                bun pm version $NEW_VERSION

                # 配置git用户信息
                git config user.name "github-actions[bot]"
                git config user.email "github-actions[bot]@users.noreply.github.com"

                # 提交版本更新
                git add package.json bun.lock
                git commit -m "chore: bump version to $NEW_VERSION"
                git remote set-url origin https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}.git
                if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
                  git push origin $BRANCH_NAME
                fi

                # 获取新的 commit ID
                COMMIT_SHORT=$(git rev-parse --short HEAD)
                TAG_NAME="v${NEW_VERSION}-${COMMIT_SHORT}"

                echo "🚀 New tag with updated version: $TAG_NAME"
                echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
              else
                TAG_NAME="v${VERSION}-${COMMIT_SHORT}"
                echo "⚠️ Fallback: creating tag with commit ID: $TAG_NAME"
                echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
              fi
            else
              # Dev 分支 tag 已存在则失败（不应该发生）
              echo "⚠️ Dev tag $TAG_NAME already exists, this shouldn't happen"
              exit 1
            fi
          fi

          # 配置git用户信息（如果前面没配置）
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 创建并推送tag
          echo "Creating tag: $TAG_NAME"
          git tag $TAG_NAME
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            git remote set-url origin https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}.git
            git push origin $TAG_NAME
            echo "✅ Successfully created and pushed tag: $TAG_NAME"
          else
            echo "ℹ️ Manual workflow run: tag created locally in runner only, release will use workflow output tag name."
          fi
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN != '' && secrets.GH_TOKEN || github.token }}

  # 发布到 GitHub Releases
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-pipeline, create-tag, pack-web-cli]
    # Tag 推送时 create-tag 会被跳过，所以需要检查两种情况（排除 -dev- tag 避免重复）
    if: always() && needs.build-pipeline.result == 'success' && (needs.create-tag.result == 'success' || github.event_name == 'workflow_dispatch' || (startsWith(github.ref, 'refs/tags/') && !contains(github.ref, '-dev-')))
    # main/feature 仅验证，release/tag 才进入正式发布环境
    environment: ${{ needs.create-tag.outputs.is_dev == 'true' && 'dev-release' || 'release' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Get version for release
        id: version
        run: |
          MANUAL_TAG_NAME="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.manual_tag_name || '' }}"
          MANUAL_PRERELEASE="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.manual_prerelease || 'false' }}"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "$MANUAL_TAG_NAME" ]]; then
            TAG_NAME="$MANUAL_TAG_NAME"
            if [[ "$MANUAL_PRERELEASE" == "true" ]]; then
              IS_DEV="true"
            else
              IS_DEV="false"
            fi
            echo "🛠️ Manual release metadata: $TAG_NAME (prerelease=$IS_DEV)"
            echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
            echo "is_dev=$IS_DEV" >> $GITHUB_OUTPUT
            exit 0
          fi

          # If workflow_dispatch without manual tag, auto-generate a dev tag
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            PKG_VERSION=$(node -p "require('./package.json').version")
            TAG_NAME="v${PKG_VERSION}"
            IS_DEV="false"
            echo "🛠️ Auto-generated release tag: $TAG_NAME"
            echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
            echo "is_dev=$IS_DEV" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 判断触发来源：正式 tag 推送 or release 分支
          if [[ "$GITHUB_REF" == refs/tags/* ]] && [[ "${{ github.event_name }}" != "workflow_dispatch" ]]; then
            # 正式 Tag 推送触发（-dev- tag 已被排除，不会到达这里）
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            IS_DEV="false"
            echo "🚀 Creating stable release from tag: $TAG_NAME"
          else
            # release 分支触发，使用 create-tag job 的输出
            TAG_NAME="${{ needs.create-tag.outputs.tag_name }}"
            IS_DEV="${{ needs.create-tag.outputs.is_dev }}"
            echo "🔧 Creating development release: $TAG_NAME"
          fi

          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "is_dev=$IS_DEV" >> $GITHUB_OUTPUT

      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          path: build-artifacts

      - name: Prepare release assets (normalize updater metadata)
        shell: bash
        run: bash scripts/prepare-release-assets.sh build-artifacts release-assets

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: ${{ steps.version.outputs.is_dev == 'true' && format('Development Build {0}', steps.version.outputs.tag_name) || steps.version.outputs.tag_name }}
          files: |
            release-assets/**/*.exe
            release-assets/**/*.msi
            release-assets/**/*.dmg
            release-assets/**/*.deb
            release-assets/**/*.zip
            release-assets/**/*.yml
            release-assets/**/*.tar.gz
            release-assets/**/*.sha256
            release-assets/install-web.sh
          body: |
            **POUNDING Desktop App ${{ steps.version.outputs.tag_name }}**

            - **便携 zip（PORTABLE）**：所有平台 zip 已注入 PORTABLE 标记，解压后数据隔离到
              `exe目录/data`，不再与安装版共享单实例锁。旧版（≤2.1.41）zip 缺少该标记，
              解压后双击可能"没反应"——请使用本版本。
            - **Windows SmartScreen**：安装包尚未配置 Authenticode 证书时，首次运行可能提示
              "Windows 已保护你的电脑"，选择"仍要运行"即可；证书配置后自动消除。
            See [install-web.sh](https://yss-1256275613.cos.ap-guangzhou.myqcloud.com/pounding/releases/download/${{ steps.version.outputs.tag_name }}/install-web.sh) for Web UI deployment.
          draft: ${{ steps.version.outputs.is_dev == 'true' }}
          prerelease: ${{ steps.version.outputs.is_dev == 'true' || contains(steps.version.outputs.tag_name, 'beta') || contains(steps.version.outputs.tag_name, 'alpha') || contains(steps.version.outputs.tag_name, 'rc') }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN != '' && secrets.GH_TOKEN || github.token }}

      - name: Validate COS configuration
        env:
          TENCENT_COS_BUCKET: ${{ secrets.TENCENT_COS_BUCKET }}
          TENCENT_COS_REGION: ${{ secrets.TENCENT_COS_REGION }}
          TENCENT_COS_SECRET_ID: ${{ secrets.TENCENT_COS_SECRET_ID }}
          TENCENT_COS_SECRET_KEY: ${{ secrets.TENCENT_COS_SECRET_KEY }}
        run: |
          test -n "$TENCENT_COS_BUCKET" || { echo "::error::Missing repository secret TENCENT_COS_BUCKET"; exit 1; }
          test -n "$TENCENT_COS_REGION" || { echo "::error::Missing repository secret TENCENT_COS_REGION"; exit 1; }
          test -n "$TENCENT_COS_SECRET_ID" || { echo "::error::Missing repository secret TENCENT_COS_SECRET_ID"; exit 1; }
          test -n "$TENCENT_COS_SECRET_KEY" || { echo "::error::Missing repository secret TENCENT_COS_SECRET_KEY"; exit 1; }

      - name: Install COSCLI
        run: |
          curl -L --fail --retry 3 --retry-delay 2 \
            -o coscli \
            https://cosbrowser.cloud.tencent.com/software/coscli/coscli-linux-amd64
          # NOTE: This checksum pins a specific coscli binary version from Tencent COS.
          # Update if Tencent releases a new coscli version or the binary changes.
          echo '7165f2ae16c5f7ac495864c963ca574a76e04ec72680d7bc8a8eee3234d8cf91  coscli' | sha256sum -c -
          chmod 755 coscli
          ./coscli --version

      - name: Mirror release assets to COS (versioned)
        timeout-minutes: 120
        continue-on-error: true
        # 保险：COS 只允许 release 流程（tag / 手动发布 / release 分支触发
        # create-tag 成功）上传。即使未来有人放宽本 job 的 if，普通 push 也
        # 不会写入 COS —— 避免非发布构建烧 COS 流量/存储。
        if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.create-tag.result == 'success' || (startsWith(github.ref, 'refs/tags/') && !contains(github.ref, '-dev-'))) }}
        shell: bash
        env:
          COS_BUCKET: ${{ secrets.TENCENT_COS_BUCKET }}
          COS_REGION: ${{ secrets.TENCENT_COS_REGION }}
          COS_SECRET_ID: ${{ secrets.TENCENT_COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.TENCENT_COS_SECRET_KEY }}
        run: |
          set -euo pipefail

          # Use the public global-acceleration endpoint (cross-border friendly
          # from GitHub US runners). The *internal* acceleration domain
          # (cos-internal.*.tencentcos.cn) is unreachable outside Tencent Cloud.
          coscli_cmd() {
            ./coscli "$@" \
              -e "cos.accelerate.myqcloud.com" \
              -i "$COS_SECRET_ID" \
              -k "$COS_SECRET_KEY" \
              --init-skip=true \
              --disable-log=true
          }

          # --routines: parallel files, --thread-num: parallel parts per file.
          coscli_cmd cp -r --routines 8 --thread-num 16 release-assets/ "cos://${COS_BUCKET}/pounding/releases/download/${{ steps.version.outputs.tag_name }}/"

      - name: Mirror release assets to COS (latest)
        timeout-minutes: 120
        continue-on-error: true
        # 保险：与 versioned 步骤一致，仅 release 流程上传。
        if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.create-tag.result == 'success' || (startsWith(github.ref, 'refs/tags/') && !contains(github.ref, '-dev-'))) }}
        shell: bash
        env:
          COS_BUCKET: ${{ secrets.TENCENT_COS_BUCKET }}
          COS_REGION: ${{ secrets.TENCENT_COS_REGION }}
          COS_SECRET_ID: ${{ secrets.TENCENT_COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.TENCENT_COS_SECRET_KEY }}
        run: |
          set -euo pipefail

          # Use the public global-acceleration endpoint (cross-border friendly
          # from GitHub US runners). The *internal* acceleration domain
          # (cos-internal.*.tencentcos.cn) is unreachable outside Tencent Cloud.
          coscli_cmd() {
            ./coscli "$@" \
              -e "cos.accelerate.myqcloud.com" \
              -i "$COS_SECRET_ID" \
              -k "$COS_SECRET_KEY" \
              --init-skip=true \
              --disable-log=true
          }

          # Upload from local assets (accelerated + concurrent). Server-side
          # cos->cos recursive copy is unreliable on this coscli version
          # (all objects fail with zero transfer), so upload locally instead.
          coscli_cmd rm -r -f "cos://${COS_BUCKET}/pounding/releases/latest/" || true
          coscli_cmd cp -r --routines 8 --thread-num 16 release-assets/ "cos://${COS_BUCKET}/pounding/releases/latest/"

          find release-assets -maxdepth 1 -type f \( -name '*.yml' -o -name '*.blockmap' \) | sort | while read -r file; do
            name="$(basename "$file")"
            coscli_cmd cp \
              "$file" \
              "cos://${COS_BUCKET}/pounding/releases/latest/${name}" \
              --meta 'Cache-Control:no-cache,max-age=0'
          done
